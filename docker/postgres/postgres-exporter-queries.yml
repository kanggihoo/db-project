pg_concurrency_activity:
  query: |
    SELECT COUNT(*) FILTER (WHERE wait_event_type = 'Lock') AS lock_waiting_sessions,
           COUNT(*) FILTER (WHERE state = 'idle in transaction') AS idle_in_transaction_sessions,
           COUNT(*) FILTER (WHERE xact_start IS NOT NULL) AS open_transactions,
           EXTRACT(EPOCH FROM COALESCE(MAX(now() - xact_start) FILTER (WHERE xact_start IS NOT NULL), INTERVAL '0 seconds')) AS max_xact_age_seconds
    FROM pg_stat_activity
    WHERE datname = current_database();
  metrics:
    - lock_waiting_sessions:
        usage: "GAUGE"
        description: "Sessions currently waiting on PostgreSQL locks."
    - idle_in_transaction_sessions:
        usage: "GAUGE"
        description: "Sessions currently idle in transaction."
    - open_transactions:
        usage: "GAUGE"
        description: "Sessions with an open transaction."
    - max_xact_age_seconds:
        usage: "GAUGE"
        description: "Age in seconds of the oldest open transaction."

pg_concurrency_locks:
  query: |
    SELECT locktype,
           mode,
           granted::text AS granted,
           COUNT(*) AS lock_count
    FROM pg_locks
    WHERE locktype IN ('relation', 'tuple', 'transactionid')
    GROUP BY locktype, mode, granted
    ORDER BY locktype, mode, granted;
  metrics:
    - locktype:
        usage: "LABEL"
        description: "PostgreSQL lock type."
    - mode:
        usage: "LABEL"
        description: "PostgreSQL lock mode."
    - granted:
        usage: "LABEL"
        description: "Whether the lock is granted."
    - lock_count:
        usage: "GAUGE"
        description: "Number of locks grouped by type, mode, and granted state."

pg_concurrency_lock_waits:
  query: |
    SELECT wait_event,
           COUNT(*) AS waiting_sessions
    FROM pg_stat_activity
    WHERE wait_event_type = 'Lock'
      AND datname = current_database()
    GROUP BY wait_event
    ORDER BY wait_event;
  metrics:
    - wait_event:
        usage: "LABEL"
        description: "PostgreSQL lock wait event."
    - waiting_sessions:
        usage: "GAUGE"
        description: "Sessions waiting on each PostgreSQL lock wait event."
