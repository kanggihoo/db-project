id: phase-focus
rows:
  - title: Phase 1 Baseline Focus
    panels:
      - type: timeseries
        title: Phase 1 Baseline Focus Latency
        query: k6.focus.latency
        layout:
          x: 0
          yOffset: 0
          w: 12
          h: 8
        legend: p95
      - type: timeseries
        title: Phase 1 Baseline Focus Table Scan
        query: postgres.seq_scan_by_table
        layout:
          x: 12
          yOffset: 0
          w: 12
          h: 8
        legend: '{{relname}}'
