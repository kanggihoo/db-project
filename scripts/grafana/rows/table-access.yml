id: table-access
title: Table Access
panels:
  - type: timeseries
    title: Seq Scan by Table
    query: postgres.seq_scan_by_table
    layout:
      x: 0
      yOffset: 0
      w: 24
      h: 8
    legend: '{{relname}}'
  - type: timeseries
    title: Index Scan by Table
    query: postgres.index_scan_by_table
    layout:
      x: 0
      yOffset: 8
      w: 24
      h: 8
    legend: '{{relname}}'
  - type: timeseries
    title: Seq Tuples Read Rate by Table
    query: postgres.seq_tuples_read
    layout:
      x: 0
      yOffset: 16
      w: 12
      h: 8
    legend: '{{relname}}'
  - type: timeseries
    title: Index Tuples Fetch Rate by Table
    query: postgres.index_tuples_fetch
    layout:
      x: 12
      yOffset: 16
      w: 12
      h: 8
    legend: '{{relname}}'
