id: hikari-pool
title: Hikari Pool
panels:
  - type: timeseries
    title: Active Connections
    query: hikari.active_connections
    layout:
      x: 0
      yOffset: 0
      w: 12
      h: 8
    legend: active
  - type: timeseries
    title: Max Connections
    query: hikari.max_connections
    layout:
      x: 12
      yOffset: 0
      w: 12
      h: 8
    legend: max
  - type: timeseries
    title: Pending Threads
    query: hikari.pending_threads
    layout:
      x: 0
      yOffset: 8
      w: 12
      h: 8
    legend: pending
  - type: timeseries
    title: Acquire Time
    query: hikari.acquire_time
    layout:
      x: 12
      yOffset: 8
      w: 12
      h: 8
    legend: avg acquire
